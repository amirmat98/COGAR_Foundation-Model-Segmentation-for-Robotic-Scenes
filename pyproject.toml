[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cogar-seg"
version = "0.1.0"
description = "COGAR foundation-model segmentation benchmark utilities."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "opencv-python",
    "pandas",
    "pycocotools",
    "PyYAML",
    "torch",
    "segment-anything",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
