dataset:
  name: COGAR-SimRobotics-500
  output_dir: data/cogar_sim_500
  num_images: 500
  image_width: 640
  image_height: 480
  format: coco_instance_segmentation

splits:
  train: 350
  val: 75
  test: 75

challenges:
  reflective_metal: 100
  transparent_glass: 100
  partial_occlusion: 100
  small_parts: 100
  dynamic_scene: 100

categories:
  - id: 1
    name: table
  - id: 2
    name: robot_gripper
  - id: 3
    name: metal_part
  - id: 4
    name: glass_object
  - id: 5
    name: plastic_object
  - id: 6
    name: screw
  - id: 7
    name: connector
  - id: 8
    name: cable
  - id: 9
    name: tool
  - id: 10
    name: box
  - id: 11
    name: bottle
  - id: 12
    name: unknown_object

generation:
  base_scenes: 50
  captures_per_scene: 10
  camera_views:
    - front
    - top
    - oblique_left
    - oblique_right
  lighting:
    - soft
    - strong_directional
    - low_light
    - backlight
  occlusion_levels:
    - none
    - mild
    - medium
    - severe