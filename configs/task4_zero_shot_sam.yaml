task:
  name: task4_zero_shot_sam
  description: zero-shot SAM-family segmentation inference
  output_root: results/task4_zero_shot_sam
  prompt_manifest_dir: outputs/task4_zero_shot_sam/prompts
  seed: 5884715

datasets:
  isaac_official_unitree_g1:
    enabled: true
    root: /mnt/Info/COGAR_DATASETs/Isacc_dataset/datasets/robotic_sdg_v3_official_g1_1000
    annotation_file: /mnt/Info/COGAR_DATASETs/Isacc_dataset/datasets/robotic_sdg_v3_official_g1_1000/annotations/instances_coco.json
    image_path:
      mode: coco_file_name_relative_to_root

  blenderproc_cogar_sim:
    enabled: true
    root: /mnt/Info/COGAR_DATASETs/BlenderProc_cogar_sim_1000
    annotation_file: /mnt/Info/COGAR_DATASETs/BlenderProc_cogar_sim_1000/annotations/instances_all.json
    image_path:
      mode: basename_in_image_dir
      image_dir: /mnt/Info/COGAR_DATASETs/BlenderProc_cogar_sim_1000/rgb

  ocid:
    enabled: true
    root: /mnt/Info/COGAR_DATASETs/OCID-dataset
    annotation_file: outputs/datasets/ocid/instances_all.json
    image_path:
      mode: coco_file_name_relative_to_root

prompt_modes:
  point:
    enabled: true
    source: mask_pixel_nearest_centroid
    point_labels:
      - 1
  box:
    enabled: true
    source: coco_bbox_xywh
    output_format: xyxy
  automatic:
    enabled: true
    source: no_prompt

models:
  sam_vit_h:
    enabled: true
    family: sam
    model_type: vit_h
    checkpoint: checkpoints/sam/sam_vit_h_4b8939.pth

  sam_vit_b:
    enabled: true
    family: sam
    model_type: vit_b
    checkpoint: checkpoints/sam/sam_vit_b_01ec64.pth

  sam2_hiera_large:
    enabled: true
    family: sam2
    model_cfg: configs/sam2.1/sam2.1_hiera_l.yaml
    checkpoint: checkpoints/sam2/sam2.1_hiera_large.pt

  fastsam_x:
    enabled: true
    family: fastsam
    checkpoint: checkpoints/fastsam/FastSAM.pt
    imgsz: 1024
    conf: 0.4
    iou: 0.9

runtime:
  device: cuda
  smoke_images_per_dataset: 5
  prediction_format: coco_rle_jsonl
  keep_multimask_candidates: true
