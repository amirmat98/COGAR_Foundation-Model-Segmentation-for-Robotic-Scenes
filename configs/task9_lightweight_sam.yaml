task:
  name: task9_lightweight_sam
  description: lightweight SAM-family zero-shot inference for edge-deployment trade-off analysis
  output_root: results/task9_lightweight_sam
  prompt_manifest_dir: outputs/task4_zero_shot_sam/prompts
  seed: 5884715

datasets:
  $ref: common.yaml#/datasets

prompt_modes:
  $ref: common.yaml#/prompt_modes

models:
  mobile_sam_vit_t:
    enabled: true
    family: mobile_sam
    model_type: vit_t
    checkpoint: checkpoints/mobile_sam/mobile_sam.pt

  efficient_sam_ti:
    enabled: true
    family: efficient_sam
    variant: vitt
    checkpoint: checkpoints/efficient_sam/efficient_sam_vitt.pt
    automatic_points_per_side: 8
    automatic_batch_queries: 64
    automatic_multimask_output: false

  efficient_sam_s:
    enabled: true
    family: efficient_sam
    variant: vits
    checkpoint: checkpoints/efficient_sam/efficient_sam_vits.pt
    automatic_points_per_side: 8
    automatic_batch_queries: 64
    automatic_multimask_output: false

runtime:
  $ref: common.yaml#/runtime/zero_shot
